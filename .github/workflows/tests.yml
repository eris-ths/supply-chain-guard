name: tests

# Runs the SCG test suite on every push and PR. The suite includes:
#   - scanner behavior (IOC, respond safety, Python scan, 2026 threats)
#   - doc-rot guard (test-docs-commands.sh): every scripts/*.sh path referenced
#     in README.md / SKILL.md must exist. This is the CI-safe half of "verify
#     doc commands"; guild-cli `gate` examples need guild-cli and are checked
#     manually against `--help` (SCG stays dependency-free — no guild-cli in CI).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Show environment
        run: |
          bash --version | head -1
          python3 --version

      - name: Run test suite
        run: bash tests/run-all.sh

      - name: Verify README integrity checksums are up to date
        run: |
          # Regenerate into a temp copy and diff — fail if drift, so a scanner
          # change that forgot `update-checksums.sh` is caught in CI.
          cp README.md /tmp/README.before
          bash scripts/update-checksums.sh
          if ! diff -q /tmp/README.before README.md >/dev/null; then
            echo "::error::README checksums are stale. Run scripts/update-checksums.sh and commit."
            diff /tmp/README.before README.md || true
            exit 1
          fi
          echo "Checksums up to date."

  # Windows scanner cannot run the bash suite (no lsof/pgrep), so we verify the
  # PowerShell IOC scanner separately: it must parse and run clean-exit 0 on a
  # clean runner. This is the Windows analogue of the clean-machine no-FP test —
  # it guards against the class of bug where set/pipefail-style aborts make a
  # clean project report CRITICAL (the sh side of this is in test-ioc-2026-threats).
  windows-ps1:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse-check ioc-scan.ps1 (syntax must be valid)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tokens = $null; $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "scripts/ioc-scan.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host "::error::$_" }
            exit 1
          }
          Write-Host "ioc-scan.ps1 parses clean."

      - name: Run ioc-scan.ps1 on clean runner (must exit 0, no false positive)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          ./scripts/ioc-scan.ps1
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::ioc-scan.ps1 reported CRITICAL on a clean runner (false positive)"
            exit 1
          }
          Write-Host "ioc-scan.ps1 clean-exit 0 on clean runner."
